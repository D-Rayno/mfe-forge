name: Dependency Audit

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.1.0'
      - run: bun install
      - run: npm audit --omit=dev --audit-level=high
