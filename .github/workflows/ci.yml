name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$GH_REF" "https://x-access-token:$GH_TOKEN@github.com/$GH_REPOSITORY.git" "$GITHUB_WORKSPACE"

      - name: Install Bun
        shell: bash
        run: |
          set -euo pipefail
          npm install --global bun@1.1.0
          bun --version

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test
